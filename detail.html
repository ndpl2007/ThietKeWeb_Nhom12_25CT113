<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết tài liệu | Kho tri thức</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="Quay lại Kho tri thức">
      <span aria-hidden="true">◈</span>
      <span>Kho tri thức</span>
    </a>
    <nav aria-label="Điều hướng chính">
      <a href="index.html">← Quay lại thư viện</a>
    </nav>
  </header>

  <main class="detail-page">
    <section class="page-intro" aria-labelledby="page-title">
      <p class="eyebrow">THƯ VIỆN CỦA BẠN</p>
      <h1 id="page-title">Chi tiết tài liệu</h1>
    </section>

    <article id="detail-content" aria-label="Thông tin tài liệu">
      <p>Đang tải thông tin tài liệu...</p>
    </article>

    <section class="notes-section" aria-labelledby="notes-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">GHI NHỚ NHANH</p>
          <h2 id="notes-heading">Ghi chú</h2>
        </div>
      </div>

      <form id="note-form">
        <div class="form-field">
          <label for="note-text">Nội dung ghi chú</label>
          <textarea
            id="note-text"
            name="text"
            rows="3"
            maxlength="500"
            required
            placeholder="Ghi lại điều bạn muốn nhớ..."
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="submit">Thêm ghi chú</button>
          <p id="note-message" role="status" aria-live="polite"></p>
        </div>
      </form>

      <ul id="note-list">
        <li>Chưa có ghi chú nào.</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">Quay lại thư viện</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
